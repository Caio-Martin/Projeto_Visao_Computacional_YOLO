services:
  visao-metal:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: visao-metal
    environment:
      DISPLAY: ${DISPLAY}
      WAYLAND_DISPLAY: ${WAYLAND_DISPLAY}
      XDG_RUNTIME_DIR: ${XDG_RUNTIME_DIR}
      PULSE_SERVER: ${PULSE_SERVER}
      QT_X11_NO_MITSHM: "1"
    volumes:
      - ..:/app
      - ../data:/data
      - /mnt/wslg:/mnt/wslg
    devices:
      - /dev/video0:/dev/video0
    stdin_open: true
    tty: true
    command: ["python", "sistema_visao_ia.py", "gui"]
